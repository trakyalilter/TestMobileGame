<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"><title>Horizon Idle app icon (small)</title><desc>Small-size variant: gold gear framing a bright sunrise core over a dark limb; comet, moon and stars removed and the sun core enlarged for legibility at 16-48px.</desc>
