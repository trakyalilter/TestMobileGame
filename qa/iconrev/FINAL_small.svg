<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"><title>Horizon Idle app icon</title><desc>A gold ringed medallion holding a bright sunrise cresting a dark planetary limb against deep navy space, with a top-lit crown highlight, a faint cyan comet and a small blue moon.</desc>
<defs>
<clipPath id="tile"><rect x="0" y="0" width="512" height="512" rx="104"/></clipPath>
<clipPath id="emblem"><circle cx="256" cy="256" r="176"/></clipPath>
<clipPath id="planet"><path d="M80 360 Q256 300 432 360 L432 432 L80 432 Z"/></clipPath>

<linearGradient id="field" x1="256" y1="40" x2="256" y2="472" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#070f24"/>
<stop offset="0.45" stop-color="#0a1733"/>
<stop offset="0.78" stop-color="#0e2150"/>
<stop offset="1" stop-color="#16356e"/>
</linearGradient>

<radialGradient id="discGlow" cx="256" cy="324" r="220" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffe39a" stop-opacity="0.8"/>
<stop offset="0.3" stop-color="#f0a92a" stop-opacity="0.48"/>
<stop offset="0.6" stop-color="#c87a16" stop-opacity="0.15"/>
<stop offset="1" stop-color="#c87a16" stop-opacity="0"/>
</radialGradient>

<linearGradient id="innerSky" x1="256" y1="80" x2="256" y2="372" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#070f24"/>
<stop offset="0.5" stop-color="#0b1a3c"/>
<stop offset="0.82" stop-color="#1c3158"/>
<stop offset="1" stop-color="#3a2a1a"/>
</linearGradient>

<radialGradient id="atmo" cx="256" cy="330" r="190" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffd36a" stop-opacity="0.85"/>
<stop offset="0.3" stop-color="#f0a92a" stop-opacity="0.5"/>
<stop offset="0.6" stop-color="#e8881f" stop-opacity="0.2"/>
<stop offset="1" stop-color="#e8881f" stop-opacity="0"/>
</radialGradient>

<radialGradient id="sunBloom" cx="256" cy="334" r="150" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
<stop offset="0.32" stop-color="#fff0c2" stop-opacity="0.82"/>
<stop offset="0.66" stop-color="#ffd36a" stop-opacity="0.34"/>
<stop offset="1" stop-color="#ffd36a" stop-opacity="0"/>
</radialGradient>

<radialGradient id="sun" cx="248" cy="320" r="104" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="0.34" stop-color="#fff4d2"/>
<stop offset="0.66" stop-color="#ffd36a"/>
<stop offset="1" stop-color="#f0a92a"/>
</radialGradient>

<linearGradient id="limb" x1="256" y1="300" x2="256" y2="432" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#14213f"/>
<stop offset="1" stop-color="#060a18"/>
</linearGradient>

<linearGradient id="ringFill" x1="256" y1="64" x2="256" y2="448" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff2cf"/>
<stop offset="0.34" stop-color="#ffd36a"/>
<stop offset="0.66" stop-color="#e89a1f"/>
<stop offset="1" stop-color="#a9670c"/>
</linearGradient>
</defs>

<g clip-path="url(#tile)">
<rect x="0" y="0" width="512" height="512" fill="url(#field)"/>
<rect x="0" y="110" width="512" height="402" fill="url(#discGlow)"/>

<circle cx="96" cy="104" r="3.2" fill="#ffffff"/>
<circle cx="420" cy="120" r="2.6" fill="#dff4ff"/>
<circle cx="150" cy="70" r="2.1" fill="#ffffff"/>
<circle cx="360" cy="62" r="2.4" fill="#ffffff"/>
<circle cx="452" cy="206" r="2.0" fill="#cfe6ff"/>
<circle cx="64" cy="206" r="2.2" fill="#ffffff"/>
<circle cx="300" cy="90" r="1.7" fill="#dff4ff"/>
<circle cx="210" cy="94" r="1.7" fill="#ffffff"/>

<g clip-path="url(#emblem)">
<rect x="80" y="80" width="352" height="352" fill="url(#innerSky)"/>
<ellipse cx="256" cy="340" rx="200" ry="150" fill="url(#atmo)"/>
<ellipse cx="256" cy="334" rx="150" ry="96" fill="url(#sunBloom)"/>

<g clip-path="url(#planet)">
<path d="M80 360 Q256 300 432 360 L432 432 L80 432 Z" fill="url(#limb)"/>
<path d="M80 360 Q256 300 432 360" fill="none" stroke="#ffd36a" stroke-width="5" stroke-linecap="round"/>
<path d="M80 361 Q256 301 432 361" fill="none" stroke="#fff4d4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</g>

<circle cx="256" cy="346" r="86" fill="url(#sun)"/>
<circle cx="250" cy="334" r="50" fill="#ffffff" opacity="0.34"/>
<circle cx="250" cy="334" r="34" fill="#ffffff"/>


</g>

<circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringFill)" stroke-width="26"/>

<path d="M150 134 A190 190 0 0 1 362 134" fill="none" stroke="#fff7e0" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
</g>
</svg>
