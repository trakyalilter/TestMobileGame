<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"><title>Horizon Idle app icon</title><desc>A bright gold sun cresting a dark planetary limb against deep navy space, with a wide radial atmosphere glow and a few stars.</desc>
