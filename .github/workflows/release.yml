name: Build & Release APK

# Builds the Android APK in CI and attaches it to a GitHub Release, so the
# binary lives on Releases instead of in git history.
#  - Manual run (Actions → "Run workflow") → publishes a prerelease "dev-build-<n>".
#  - Pushing a tag like v0.2  → publishes a normal release for that tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5"
  EXPORT_NAME: StellarForge

jobs:
  android:
    name: Export Android (debug-signed)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          cp -r /root/.config/godot ~/.config/godot 2>/dev/null || true
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/ || true

      - name: Use the committed stable debug keystore
        run: |
          # A FIXED keystore (ci-debug.keystore, committed) is reused on every
          # build so all dev APKs share one signature — Android can then install
          # each new build as an update instead of rejecting it with "package
          # conflicts with an existing package". (Debug key: not for Play Store;
          # production uses a real release key from a secret.)
          cp "$GITHUB_WORKSPACE/ci-debug.keystore" "$GITHUB_WORKSPACE/debug.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android | head -n 3

      - name: Configure Godot editor settings (SDK / JDK / keystore)
        run: |
          mkdir -p ~/.config/godot
          CFG="$(ls ~/.config/godot/editor_settings-*.tres 2>/dev/null | head -n1)"
          [ -z "$CFG" ] && CFG=~/.config/godot/editor_settings-4.5.tres
          # Derive a real JDK home (must contain bin/) from the keytool binary.
          JDK="$(dirname "$(dirname "$(readlink -f "$(command -v keytool)")")")"
          echo "Detected JDK: $JDK"; ls "$JDK/bin/java" || true
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo "export/android/java_sdk_path = \"$JDK\""
          } > "$CFG"
          echo "Wrote $CFG"; cat "$CFG"

      # This preset is DELIBERATELY a different app id from the Play build
      # (com.horizon.idle). These APKs are signed with the committed debug key, so
      # sharing the Play id would make the eventual Play install fail with a
      # signature mismatch — and the only cure is uninstalling, which takes the
      # player's save with it. Separate ids let a dev build and the store build
      # coexist on one phone. com.stellarforge.game is also the id every APK so
      # far has carried, so changing it would orphan existing saves.
      #
      # NOTHING inside the heredoc may start with '#'. Godot's ConfigFile takes
      # ';' as its comment character; '#' does not error, it welds the comment
      # text onto the NEXT key's name, so that key silently vanishes and its
      # value falls back to the default.
      - name: Write export preset
        run: |
          cat > export_presets.cfg <<EOF
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          export_path="build/${EXPORT_NAME}.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=${{ github.run_number }}
          version/name="0.1.${{ github.run_number }}"
          package/unique_name="com.stellarforge.game"
          package/name="Stellar Forge"
          package/signed=true
          screen/immersive_mode=true
          user_data_backup/allow=false
          permissions/internet=true
          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF
          cat export_presets.cfg

      - name: Import project
        run: |
          godot --headless --path . --import 2>&1 | tail -n 20 || true
          godot --headless --path . --import 2>&1 | tail -n 20 || true

      # The import/export steps above never fail on GDScript compile errors
      # (`|| true`, and APK export packs broken scripts), so a script that
      # cannot compile can ship a build that won't boot. This step fails the
      # job if the import log shows any script error.
      - name: Verify scripts compile
        run: |
          godot --headless --path . --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" import.log; then
            echo "::error::GDScript compile/parse errors detected — the APK would not boot"
            exit 1
          fi

      # The app id decides whether a new build updates the one on your phone or
      # installs beside it with an empty save, so assert what Godot actually
      # parsed rather than what the heredoc above appears to say.
      - name: Verify Godot reads the preset we wrote
        env:
          EXPECT_PACKAGE: com.stellarforge.game
          REQUIRE_KEYS: "keystore/debug,keystore/debug_user,package/signed"
        # Bounded: a runtime error in _init aborts before quit(), which hangs the
        # process rather than failing it.
        run: timeout 300 godot --headless --path . --script tools/check_export_preset.gd

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/${EXPORT_NAME}.apk"
          ls -la build/
          test -f "build/${EXPORT_NAME}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: build/${{ env.EXPORT_NAME }}.apk

      - name: Publish prerelease (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: Dev build #${{ github.run_number }}
          prerelease: true
          files: build/${{ env.EXPORT_NAME }}.apk

      - name: Publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.EXPORT_NAME }}.apk
